{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-warning text-dark">
                    <h4 class="mb-0">👑 Acceso Cliente Socio</h4>
                </div>
                <div class="card-body">
                    {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                    {% endif %}
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="dni" class="form-label">Número de Documento (DNI)</label>
                            <input type="text" class="form-control" id="dni" name="dni" 
                                   placeholder="Ingrese solo su DNI" required
                                   pattern="[0-9]{7,8}" title="Ingrese un DNI válido (7 u 8 dígitos)">
                            <div class="form-text">
                                Solo se requiere el DNI para identificar su cuenta de socio.
                            </div>
                        </div>
                        <button type="submit" class="btn btn-warning w-100 btn-lg">Ingresar Como Socio</button>
                    </form>
                    
                    <div class="mt-3 text-center">
                        <a href="{% url 'cart:home' %}" class="btn btn-outline-secondary">
                            ← Volver al Inicio
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
