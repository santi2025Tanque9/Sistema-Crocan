{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Gestión de Pedidos{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Estilos propios -->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            
            <!-- Sidebar -->
            <div class="col-md-2 sidebar d-flex flex-column align-items-center py-4 shadow border rounded min-vh-100">
                <div class="mb-4">
                    <img src="{% static 'image/logo.jpg' %}" alt="Logo" class="img-fluid" style="max-height: 120px;">
                </div>
                <a href="{% url 'cart:home' %}" class="btn btn-danger w-100 mb-3">
                    🛒 Pedido
                </a>
                <a href="#" class="btn btn-secondary w-100 mb-3">
                    📊 Estado
                </a>
                <a href="{% url 'cart:home' %}" class="btn btn-dark w-100">
                    🚪 Cerrar Sesión
                </a>
            </div>

            <!-- Contenido principal -->
            <div class="col-md-10 py-4">
                {% block content %}{% endblock %}
            </div>

        </div>
    </div>

    <!-- Bootstrap icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    
    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- JavaScript personalizado -->
    {% block scripts %}{% endblock %}
</body>
</html>
